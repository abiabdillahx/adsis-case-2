<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara Tech - Academic System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto font-bold text-xl">
            🎓 Nusantara Tech Academic
        </div>
    </nav>

    <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Form Section -->
        <div class="bg-white p-6 rounded-lg shadow-md h-fit">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Registrasi Mahasiswa</h2>
            <form id="studentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                    <input type="text" id="name" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">NIM</label>
                    <input type="text" id="nim" name="nim" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Foto Profil</label>
                    <input type="file" id="file" name="file" accept="image/*" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                    Simpan Data
                </button>
            </form>
            <div id="status" class="mt-4 text-sm hidden"></div>
        </div>

        <!-- List Section -->
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Daftar Mahasiswa</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Foto</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">NIM</th>
                        </tr>
                    </thead>
                    <tbody id="studentList" class="bg-white divide-y divide-gray-200">

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('studentForm');
        const status = document.getElementById('status');
        const list = document.getElementById('studentList');

        // Fetch and display students
        async function fetchStudents() {
            const res = await fetch('/students');
            const students = await res.json();
            list.innerHTML = '';
            students.forEach(s => {
                list.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <div class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden border">
                                <img src="/students/image/${s.profile_image}" alt="Profile" class="h-full w-full object-cover">
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${s.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.nim}</td>
                    </tr>
                `;
            });
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            try {
                const res = await fetch('/students', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    status.innerText = '✅ Berhasil menyimpan data!';
                    status.className = 'mt-4 text-sm text-green-600';
                    form.reset();
                    fetchStudents();
                } else {
                    throw new Error('Gagal menyimpan');
                }
            } catch (err) {
                status.innerText = '❌ Error: ' + err.message;
                status.className = 'mt-4 text-sm text-red-600';
            } finally {
                status.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Simpan Data';
            }
        });

        fetchStudents();
    </script>
</body>
</html>
