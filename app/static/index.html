<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusantara Tech | Academic System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-[#1e293b]">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 mb-8">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Nusantara Tech <span class="text-slate-400 font-normal">| Academic</span></h1>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left: Form -->
            <div class="lg:col-span-4">
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-slate-100 bg-slate-50/50">
                        <h2 class="font-semibold text-slate-800 text-lg">Registrasi Mahasiswa</h2>
                        <p class="text-sm text-slate-500">Input data mahasiswa baru ke sistem.</p>
                    </div>
                    <form id="studentForm" class="p-6 space-y-5">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Nama Lengkap</label>
                            <input type="text" id="name" name="name" placeholder="Nama Mahasiswa" required 
                                class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm transition-all focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500">NIM</label>
                            <input type="text" id="nim" name="nim" placeholder="Nomor Induk Mahasiswa" required 
                                class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-lg text-sm transition-all focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Foto Profil</label>
                            <input type="file" id="file" name="file" accept="image/*" required 
                                class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                        </div>
                        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                            <span>Simpan Data</span>
                        </button>
                    </form>
                    <div id="status" class="mx-6 mb-6 p-4 rounded-lg text-sm font-medium hidden"></div>
                </div>
            </div>

            <!-- Right: List -->
            <div class="lg:col-span-8">
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <div class="p-6 border-b border-slate-100">
                        <h2 class="font-semibold text-slate-800 text-lg">Daftar Mahasiswa Terdaftar</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="bg-slate-50/50 border-b border-slate-100 text-xs font-bold uppercase tracking-wider text-slate-400">
                                    <th class="px-6 py-4">Profil</th>
                                    <th class="px-6 py-4">Mahasiswa</th>
                                    <th class="px-6 py-4">Status</th>
                                </tr>
                            </thead>
                            <tbody id="studentList" class="divide-y divide-slate-100">
                                <!-- Items injected here -->
                            </tbody>
                        </table>
                        <div id="emptyState" class="p-16 text-center hidden">
                            <p class="text-slate-400 italic">Belum ada mahasiswa yang terdaftar.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('studentForm');
        const status = document.getElementById('status');
        const list = document.getElementById('studentList');
        const emptyState = document.getElementById('emptyState');

        async function fetchStudents() {
            try {
                const res = await fetch('/students');
                const students = await res.json();
                
                list.innerHTML = '';
                
                if (students.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                students.forEach(s => {
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="h-10 w-10 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200">
                                    <img src="/students/image/${s.profile_image}" class="h-full w-full object-cover">
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-semibold text-slate-900">${s.name}</div>
                                <div class="text-xs text-slate-500 font-mono">${s.nim}</div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-green-50 text-green-700 border border-green-100">Verified</span>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Fetch error");
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            try {
                const res = await fetch('/students', { method: 'POST', body: formData });
                if (res.ok) {
                    status.innerText = '✅ Data berhasil disimpan!';
                    status.className = 'mx-6 mb-6 p-4 rounded-lg text-sm font-medium bg-green-50 text-green-700 border border-green-100';
                    form.reset();
                    fetchStudents();
                } else {
                    throw new Error('Gagal menyimpan');
                }
            } catch (err) {
                status.innerText = '❌ ' + err.message;
                status.className = 'mx-6 mb-6 p-4 rounded-lg text-sm font-medium bg-red-50 text-red-700 border border-red-100';
            } finally {
                status.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Simpan Data';
                setTimeout(() => status.classList.add('hidden'), 3000);
            }
        });

        fetchStudents();
    </script>
</body>
</html>
